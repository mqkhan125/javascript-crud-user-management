<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management System - CRUD</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="favicon/crud.png" type="image/x-icon">
</head>
<body class="bg-light">

  <div class="container py-4">
    <!-- Main Title -->
    <h2 class="text-center text-primary fw-bold mb-4">
      <i class="fa-solid fa-users-gear me-2"></i>JAVASCRIPT CRUD OPERATION
    </h2>

    <!-- Main Card Container -->
    <div class="card border-0 shadow-sm rounded-4">
      
      <!-- Card Header / Control Bar -->
      <div class="card-header bg-primary text-white p-3 rounded-top-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
          <h4 class="mb-0 fw-bold fs-5 text-white">
            <i class="fa-solid fa-list me-2"></i>User Records
          </h4>

          <div class="d-flex flex-wrap align-items-center gap-2 w-100 w-md-auto justify-content-end">
            <!-- Search Bar -->
            <div class="input-group search-box">
              <span class="input-group-text bg-white border-end-0">
                <i class="fa fa-search text-muted"></i>
              </span>
              <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Search user..." />
            </div>

            <!-- Delete All Button -->
            <button id="deleteAllBtn" class="btn btn-danger fw-semibold d-flex align-items-center gap-1">
              <i class="fa-solid fa-trash-can"></i> <span>Delete All</span>
            </button>

            <!-- Add User Button -->
            <button id="openAddModalBtn" class="btn btn-success fw-semibold d-flex align-items-center gap-1">
              <i class="fa-solid fa-user-plus"></i> <span>Add New User</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Card Body / Table -->
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th class="ps-3">#</th>
                <th>Profile</th>
                <th>Name</th>
                <th>Email</th>
                <th>DOB</th>
                <th>Mobile</th>
                <th>Password</th>
                <th class="text-end pe-4">Actions</th>
              </tr>
            </thead>
            <tbody id="userTableBody">
              <!-- Dynamic Rows Rendered Here -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Card Footer / Pagination -->
      <div class="card-footer bg-white py-3 border-top-0 d-flex justify-content-between align-items-center">
        <small class="text-muted" id="totalRecordsText">Showing 0 entries</small>
        <nav>
          <ul class="pagination pagination-sm mb-0 gap-1" id="paginationContainer">
            <!-- Dynamic Pagination Buttons Rendered Here -->
          </ul>
        </nav>
      </div>

    </div>
  </div>

  <!-- User Form Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0 shadow rounded-4">
        
        <div class="modal-header bg-primary text-white rounded-top-4">
          <h5 class="modal-title fw-bold" id="modalTitle">Add New User</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body p-4">
          <form id="userForm" novalidate>
            <!-- Hidden Input to Store User ID during Update -->
            <input type="hidden" id="userId" />

            <div class="row g-3">
              <!-- Name Input -->
              <div class="col-md-6">
                <label class="form-label fw-medium">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-user"></i></span>
                  <input type="text" id="userName" class="form-control" placeholder="John Doe" required />
                </div>
              </div>

              <!-- Email Input -->
              <div class="col-md-6">
                <label class="form-label fw-medium">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                  <input type="email" id="userEmail" class="form-control" placeholder="john@example.com" required />
                </div>
              </div>

              <!-- Mobile Input -->
              <div class="col-md-6">
                <label class="form-label fw-medium">Mobile Number</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-phone"></i></span>
                  <input type="tel" id="userMobile" class="form-control" placeholder="03001234567" required />
                </div>
              </div>

              <!-- DOB Input -->
              <div class="col-md-6">
                <label class="form-label fw-medium">Date of Birth</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-calendar"></i></span>
                  <input type="date" id="userDOB" class="form-control" required />
                </div>
              </div>

              <!-- Password Input -->
              <div class="col-md-6">
                <label class="form-label fw-medium">Password</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa fa-lock"></i></span>
                  <input type="password" id="userPassword" class="form-control" placeholder="••••••••" required />
                </div>
              </div>

              <!-- Profile Picture Upload -->
              <div class="col-md-6">
                <label class="form-label fw-medium">Profile Image</label>
                <div class="input-group">
                  <input type="file" id="userProfile" class="form-control" accept="image/*" />
                </div>
              </div>
            </div>

            <!-- Modal Action Buttons -->
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary px-4 fw-semibold" id="submitBtn">Save User</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <!-- SweetAlert2 JS -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="script.js"></script>
</body>
</html>
